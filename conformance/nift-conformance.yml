notes: >-
  Nift's published compliance posture is privacy-led, not security-certification-led: a real
  EU-U.S./UK/Swiss Data Privacy Framework certification claim and a real coordinated
  vulnerability disclosure policy, but no SOC 2, no ISO 27001 and no trust center. For a
  company whose product is built on processing consumer email addresses across partner
  platforms, the DPF certification plus the partner-facing deletion API are the load-bearing
  controls, and both are genuinely published.
