notes: >-
  RE-PROBED 2026-08-13 across four hosts: EVERY /.well-known path 404s. Nift publishes no
  discovery surface at all — no RFC 9116 security.txt (even though a real Vulnerability
  Disclosure Policy exists as an HTML page at /business/vulnerability-disclosure-policy),
  no RFC 8414 authorization-server metadata (even though a Doorkeeper OAuth 2.0 token
  endpoint is documented at /oauth/token), no RFC 9727 api-catalog, and no agent card.
  The 404 body is Nift's branded HTML error page, not a soft-200, so these are true misses.
  THIS FILE RECORDS AN ABSENCE: no WellKnown or SecurityTxt pointer is emitted in apis.yml,
  because the pointer would assert that Nift serves a surface it does not serve. The two
  cheapest fixes available to Nift are a security.txt referencing the existing VDP and an
  /.well-known/oauth-authorization-server document describing the existing token endpoint.
