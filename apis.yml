aid: nift
name: NIFT
description: >-
  Nift is a customer-gifting and acquisition platform: businesses send "thank-you" gifts
  that let their own customers discover and try new brands, restaurants, and services,
  while the partnering brands gain new customers at the moment of gift selection. Proprietary
  AI matches each recipient to relevant gift options. For developers, Nift ships a partner
  integration surface: first-party SDKs (Web, iOS, Android, React Native) that embed the Nift
  gift-redemption "card flow" directly into a partner's app, plus a server-side Partners API
  secured with OAuth 2.0 client credentials for looking up customer eligibility status and
  submitting GDPR-style customer deletion (anonymization) requests. Backed by Foundry Group.
